name: Android Unit Test

# Chạy unit test JVM (`./gradlew test`) cho module :app.
# KHÔNG chạy connectedAndroidTest (cần emulator) — theo CONTRIBUTING.md.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: gradlew test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI Study
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37"

      # Không có local.properties trên CI → BuildConfig.GEMINI_API_KEY = "",
      # app/Unit test chạy với FakeAiClient. KHÔNG đặt key thật trong CI.
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            AI Study/app/build/reports/tests/
            AI Study/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
